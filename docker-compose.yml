services:
  # Ubuntu 20.04 用
  f1-sim-2004:
    build:
      context: .
      dockerfile: Dockerfile.2004  # 先ほど作成した 22.04 版のファイル名に合わせてください
    container_name: f1-sim-2004
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace                  # プログラムファイルをコンテナと共有
      - /tmp/.X11-unix:/tmp/.X11-unix # 画面表示用 (GUI用)
    environment:
      - DISPLAY=${DISPLAY}            # Windows(WSL)の画面出力先
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    network_mode: host                # シミュレータの通信をスムーズにする
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia          # GPUを使用するための設定
              count: all
              capabilities: [gpu]

  # Ubuntu 22.04 用
  f1-sim-2204:
    build:
      context: .
      dockerfile: Dockerfile.2204
    container_name: f1-sim-2204
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]